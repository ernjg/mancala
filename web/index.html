<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>mancala</title>
    <style>body { max-width: 30em; margin: auto; padding: 0 1em; } h1, footer { margin: 2em 0; } #board { width: 100%; table-layout: fixed; } #board button { font-size: 1.5rem; width: 100%; } fieldset { width: fit-content; } #wins tr:first-child td { text-decoration: underline; } #wins td:first-child { padding-right: 1em; }</style>
</head>
<body>
    <h1>just mancala.</h1>
    <div id="menu">
        <p>mode: <select id="mode">
            <option value="local">local</option>
            <option value="bot">bot</option>
            <option value="online">online</option>
        </select></p>
        <div id="online" hidden>
            <fieldset>
                <legend id="summary">random opponent</legend>
                <button id="random">play random</button>
            </fieldset>
            <fieldset>
                <legend>private room</legend>
                <p><button id="make">make room</button></p>
                <p>join room: <input id="code" size="4" maxlength="4"> <button id="join">join</button></p>
            </fieldset>
        </div>
    </div>
    <table id="board"></table>
    <p id="message"></p>
    <table id="wins"></table>
    <p id="controls"></p>
    <footer><a href="https://ejgomez.com/">ejgomez.com</a> · <a href="https://en.wikipedia.org/wiki/Kalah">rules</a></footer>
    <script type="module" src="/main.ts"></script>
</body>
</html>
