<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>mancala</title>
    <style>#board button { font-size: 1.5rem; min-width: 2.5em; } fieldset { width: fit-content; }</style>
</head>
<body>
    <table id="board"></table>
    <p id="message"></p>
    <table id="wins"></table>
    <p id="controls"></p>
    <div id="menu">
        <p>mode: <select id="mode">
            <option value="local">local</option>
            <option value="bot" disabled>bot</option>
            <option value="online">online</option>
        </select></p>
        <div id="online" hidden>
            <fieldset>
                <legend id="summary">random opponent</legend>
                <button id="random">play random</button>
            </fieldset>
            <fieldset>
                <legend>private room</legend>
                <p><button id="make">make room</button></p>
                <p>join room: <input id="code" size="4" maxlength="4"> <button id="join">join</button></p>
            </fieldset>
        </div>
    </div>
    <p><a href="https://ejgomez.com/">ejgomez.com</a></p>
    <script type="module" src="/main.ts"></script>
</body>
</html>
