<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <title>mancala</title>
    <style>button { min-width: 2.5em; } button, input { font-size: 1.2rem; } fieldset { width: fit-content; }</style>
</head>
<body>
    <table id="board"></table>
    <p id="message"></p>
    <p id="wins"></p>
    <p id="controls"></p>
    <details id="menu">
        <summary id="summary">play online</summary>
        <fieldset>
            <legend>random opponent</legend>
            <button id="random">play random</button>
        </fieldset>
        <fieldset>
            <legend>private room</legend>
            <p><button id="make">make room</button></p>
            <p>join room: <input id="code" size="4" maxlength="4"> <button id="join">join</button></p>
        </fieldset>
    </details>
    <p><a href="https://ejgomez.com/">ejgomez.com</a></p>
    <script type="module" src="/main.ts"></script>
</body>
</html>
